apiVersion: batch/v1
kind: Job
metadata:
  name: central-postgres-backup
spec:
  template:
    spec:
      containers:
      - name: backup
        image: postgres:17
        env:
        - name: PGPASSWORD
          value: "postgres123"
        command:
        - bash
        - -c
        - |
          apt-get update && apt-get install -y curl;
          BACKUP_FILE="/backup/backup_$(date +%Y%m%d_%H%M%S).sql";
          pg_dump -h hms-postgres-postgresql-ha-pgpool.default.svc.cluster.local -U postgres HMS_CentralDB > $BACKUP_FILE;
          curl -F "file=@$BACKUP_FILE" http://seaweed-filer:8888/backup/
        volumeMounts:
        - name: backup-volume
          mountPath: /backup
      restartPolicy: OnFailure
      volumes:
      - name: backup-volume
        emptyDir: {}