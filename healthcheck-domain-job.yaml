apiVersion: batch/v1
kind: Job
metadata:
  name: domain-healthcheck-test
spec:
  template:
    spec:
      containers:
      - name: healthcheck
        image: alpine:latest
        command:
        - sh
        - -c
        - |
          apk add --no-cache curl openssl

          DOMAIN="www.combicha.me"
          # Lấy tất cả IP trả về
          IPS=$(nslookup $DOMAIN | awk '/^Address: / { print $2 }')
          FOUND=0
          for IP in $IPS; do
            echo "IP trả về: $IP"
            if echo "$IP" | grep -q "^66\.33\.60\." || echo "$IP" | grep -q "^76\.76\.21\."; then
              FOUND=1
              break
            fi
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "DNS FAIL: $DOMAIN không có IP nào thuộc subnet hợp lệ"
            exit 1
          fi

          # Kiểm tra HTTP status code
          HTTP_CODE=$(curl -s -L -o /dev/null -w "%{http_code}" http://$DOMAIN)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "HTTP FAIL: Trang chủ trả về $HTTP_CODE"
            exit 1
          fi

          # Kiểm tra chứng chỉ SSL (HTTPS)
          SSL_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://$DOMAIN)
          if [ "$SSL_CODE" != "200" ]; then
            echo "SSL FAIL: HTTPS trả về $SSL_CODE"
            exit 1
          fi
          # Kiểm tra chi tiết chứng chỉ (ngày hết hạn, issuer)
          echo | openssl s_client -connect $DOMAIN:443 2>/dev/null | openssl x509 -noout -dates -issuer

          # Kiểm tra latency
          LATENCY=$(curl -L -o /dev/null -s -w '%{time_total}' http://$DOMAIN)
          echo "Latency: $LATENCY giây"
          echo "Healthcheck OK"
          
      restartPolicy: OnFailure