apiVersion: v1
kind: Pod
metadata:
  name: pvc-reader
  labels:
    app: pvc-reader
spec:
  containers:
  - name: pvc-reader
    image: python:3.11-slim
    command: ["python3", "-m", "http.server", "8080"]
    workingDir: /data
    ports:
    - containerPort: 8080
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: central-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pvc-reader
spec:
  selector:
    app: pvc-reader
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP