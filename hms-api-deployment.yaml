apiVersion: apps/v1
kind: Deployment
metadata:
  name: hms-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hms-api
  template:
    metadata:
      labels:
        app: hms-api
    spec:
      containers:
      - name: hms-api
        image: sangrk/hms-api:v20
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: hms-api-config
        - secretRef:
            name: hms-api-secret
        volumeMounts:
        - name: epic-privatekey
          mountPath: /src/privatekey.pem
          subPath: privatekey.pem
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /liveness
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 1
        readinessProbe:
          httpGet:
            path: /readiness
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 1
          successThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 80
          failureThreshold: 30
          periodSeconds: 10
      volumes:
      - name: epic-privatekey
        secret:
          secretName: epic-privatekey