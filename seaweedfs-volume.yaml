apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweed-volume
spec:
  serviceName: "seaweed-volume"
  replicas: 3
  selector:
    matchLabels:
      app: seaweed-volume
  template:
    metadata:
      labels:
        app: seaweed-volume
    spec:
      containers:
      - name: seaweed-volume
        image: chrislusf/seaweedfs:latest
        command: ["weed", "volume", "-dir=/data", "-mserver=seaweed-master:9333", "-port=8080"]
        ports:
        - containerPort: 8080
        - containerPort: 18080
        volumeMounts:
        - name: volume-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: volume-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: seaweed-volume
spec:
  ports:
    - name: volume-http
      port: 8080
      targetPort: 8080
    - name: volume-grpc
      port: 18080
      targetPort: 18080
  selector:
    app: seaweed-volume